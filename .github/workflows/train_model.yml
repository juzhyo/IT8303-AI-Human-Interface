name: Train FashionMNIST CNN

# This triggers the action every time you push code to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  train-model:
    runs-on: ubuntu-latest # Uses a standard Linux server

    steps:
    # 1. Grab your code from the repository
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Install Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Install your dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Make the image directory just in case it doesn't exist
    - name: Create img directory
      run: mkdir -p ./ca1/img

    # 5. Run the script and save the printed terminal output to a text file
    - name: Run Training Script
      run: python ./ca1/ca1.py > output.txt

    # 6. Upload the text file and the generated images so you can download them
    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: training-results
        path: |
          output.txt
          ./ca1/img/*.png
