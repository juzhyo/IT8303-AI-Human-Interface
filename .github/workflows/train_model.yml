name: Train FashionMNIST CNN

on:
  push:
    branches: [ "main" ]

# 1. ADD THIS TO ALLOW THE BOT TO PUSH CODE
permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create img directory
      run: mkdir -p ./ca1/img

    - name: Run Training Script
      run: python -u ca1.py | tee $(date +'%Y-%m-%d_%H-%M')_output_log.txt

    # 2. COMMIT & PUSH STEP
    - name: Commit and Push results
      if: always() 
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # ADD THIS LINE: Create a blank file just in case Python crashes!
        touch ./ca1/data/tuning_results.txt
        
        # Now Git will always find the file, even if it is empty
        git add *_output_log.txt ./ca1/img/ ./ca1/data/tuning_results.txt
        
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-save training results" && git push)
