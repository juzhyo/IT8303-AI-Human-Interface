name: Train FashionMNIST CNN

on:
  push:
    branches: [ "main" ]

jobs:
  train-model:
    runs-on: ubuntu-latest 

    steps:
    # 1. Grab your code (Updated to v4)
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install Python (Updated to v5)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install your dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Make the image directory
    - name: Create img directory
      run: mkdir -p ./ca1/img

    # 5. Run the script and save the printed terminal output
    - name: Run Training Script
      run: python ./ca1/ca1.py > output_log.txt

    # 6. Upload the text file and images (UPDATED TO v4 TO FIX YOUR ERROR)
    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: training-results
        path: |
          output_log.txt
          ./ca1/img/*.png
